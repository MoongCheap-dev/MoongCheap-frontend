name: CI

on:
  push:
    branches: [develop, main]
  # base 브랜치를 가리지 않는다. `pull_request.branches`는 base 필터라
  # 스택 PR(base가 다른 작업 브랜치)에서 워크플로가 아예 트리거되지 않았다.
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Type · Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Prettier
        run: npm run format:check
