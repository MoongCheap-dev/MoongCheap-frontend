name: Security

on:
  push:
    branches: [develop, main]
  # base 브랜치를 가리지 않는다. `pull_request.branches`는 base 필터라
  # 스택 PR(base가 다른 작업 브랜치)에서 워크플로가 아예 트리거되지 않았다.
  pull_request:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level critical --omit=dev
